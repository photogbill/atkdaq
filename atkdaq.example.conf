# atkdaq settings - copy to atkdaq.conf and pass with --config atkdaq.conf.
# Every key, its meaning and its default: atkdaq help-config
# A key atkdaq does not know is REFUSED with its line number, never ignored.

# --- the receiver -------------------------------------------------------------
device = kraken
channels = 5
# EEPROM serials in CHANNEL ORDER. A KrakenSDR ships as 1000..1004; the
# noise source is on channel 0's chip, so 1000 must stay first.
serial = 1000,1001,1002,1003,1004
fc_hz = 446000000
fs_hz = 2400000
# manual gain in tenths of a dB, identical on every channel (AGC is always off)
gain_tenths_db = 280
bias_tee = off

# --- framing ------------------------------------------------------------------
frame_ms = 50
ring_seconds = 4
out_queue_frames = 16

# --- calibration policy -------------------------------------------------------
# static: resync at the next `quiet` (or 5 s); mobile: resync at once
mode = static
sync_check_static_s = 300
sync_check_mobile_s = 60
cal_interval_static_s = 900
cal_interval_mobile_s = 120
# 0 = learn whether retunes keep the delays (the default), 1 = always sync+cal,
# 2 = always cal only
retune_policy = 0
